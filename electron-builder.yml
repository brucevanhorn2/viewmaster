appId: com.vanhorn.viewmaster
productName: View Master
directories:
  output: release
  buildResources: resources
files:
  - '!src/*'
  - '!docs/*'
  - '!resources/*'
  - '!electron.vite.config.ts'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}'
  - '!{.gitignore,README.md}'
npmRebuild: false
# No publishing / auto-update artifacts — local unsigned builds only.
publish: null
mac:
  target:
    - dmg
  # Unsigned for now — no signing keys. README documents the Gatekeeper
  # right-click -> Open step.
  identity: null
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Bruce Van Horn <brucevanhorn2@gmail.com>
win:
  target:
    - nsis

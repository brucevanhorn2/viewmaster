<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="1" stop-color="#141b34"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a31c"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="lensclip"><circle cx="610" cy="560" r="150"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)" filter="url(#sh)"/>
  <!-- back page -->
  <g transform="rotate(-8 400 460)">
    <rect x="215" y="215" width="360" height="470" rx="30" fill="#8d9bc4" opacity="0.55"/>
    <rect x="255" y="270" width="200" height="22" rx="11" fill="#2b3a67" opacity="0.5"/>
    <rect x="255" y="320" width="260" height="22" rx="11" fill="#2b3a67" opacity="0.5"/>
    <rect x="255" y="370" width="150" height="22" rx="11" fill="#2b3a67" opacity="0.5"/>
  </g>
  <!-- front page: diff -->
  <rect x="300" y="250" width="400" height="500" rx="34" fill="#f3f5fb"/>
  <rect x="345" y="305" width="150" height="24" rx="12" fill="#b5bdd6"/>
  <rect x="345" y="365" width="310" height="40" rx="10" fill="#d9f2e1"/>
  <rect x="365" y="377" width="170" height="16" rx="8" fill="#2f9e5b"/>
  <rect x="345" y="425" width="310" height="40" rx="10" fill="#fbdcdc"/>
  <rect x="365" y="437" width="215" height="16" rx="8" fill="#d64545"/>
  <rect x="345" y="485" width="310" height="40" rx="10" fill="#d9f2e1"/>
  <rect x="365" y="497" width="120" height="16" rx="8" fill="#2f9e5b"/>
  <rect x="345" y="560" width="200" height="24" rx="12" fill="#b5bdd6"/>
  <rect x="345" y="610" width="250" height="24" rx="12" fill="#b5bdd6"/>
  <!-- lens -->
  <g>
    <circle cx="610" cy="560" r="150" fill="#f3f5fb"/>
    <g clip-path="url(#lensclip)">
      <rect x="440" y="490" width="340" height="52" rx="10" fill="#d9f2e1"/>
      <rect x="480" y="507" width="200" height="18" rx="9" fill="#2f9e5b"/>
      <rect x="440" y="566" width="340" height="52" rx="10" fill="#fbdcdc"/>
      <rect x="480" y="583" width="240" height="18" rx="9" fill="#d64545"/>
    </g>
    <circle cx="610" cy="560" r="150" fill="none" stroke="url(#lens)" stroke-width="34"/>
    <line x1="718" y1="668" x2="810" y2="760" stroke="url(#lens)" stroke-width="46" stroke-linecap="round"/>
  </g>
</svg>

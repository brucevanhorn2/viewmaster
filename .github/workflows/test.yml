name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  # Superseded PR pushes are cancelled; every master commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run e2e tests
        id: e2e
        run: xvfb-run -a npm run test:e2e

      - name: Upload Playwright report
        # Only when e2e itself failed (not when unit tests failed and e2e never ran).
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Output folders are pinned to the repo root in e2e/playwright.config.ts.
          path: |
            playwright-report/
            test-results/
          retention-days: 7
